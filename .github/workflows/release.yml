name: Release

# Builds the VSIX and creates a GitHub Release on every merge to main.
# Bump the version in package.json in your PR — the workflow uses that version
# as the release tag. It will fail fast if the tag already exists (reminder to bump).
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Fail if tag already exists
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "::error::Tag v${{ steps.version.outputs.version }} already exists. Bump the version in package.json before merging to main."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npx --yes @vscode/vsce package -o "cswap-vscode-${{ steps.version.outputs.version }}.vsix"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          files: "*.vsix"
          generate_release_notes: true

      # --- Optional: publish to the VS Code Marketplace ---
      # Add a repo secret named VSCE_PAT (Azure DevOps PAT, Marketplace > Manage scope).
      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish -p "$VSCE_PAT"

      # --- Optional: publish to Open VSX (VSCodium / Cursor / Gitpod) ---
      # Add a repo secret named OVSX_PAT from https://open-vsx.org
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx publish "cswap-vscode-${{ steps.version.outputs.version }}.vsix" -p "$OVSX_PAT"
